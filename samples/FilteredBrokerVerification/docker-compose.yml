# Local Pact Broker, fronted by Caddy so every request the verifier makes is logged
# (stands in for PactFlow - the request count is what drives HTTP 429s there).
services:
  broker:
    image: pactfoundation/pact-broker:2.143.0-pactbroker2.121.0
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite3
      # links in HAL responses must point back through the proxy
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: WARN

  proxy:
    image: caddy:2.11.4-alpine
    depends_on: [broker]
    ports:
      - "9292:9292"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
