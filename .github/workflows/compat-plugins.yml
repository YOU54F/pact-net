name: Compatibility suite (V4 plugins)

# The V4 plugin features are not in the pinned suite submodule yet, so this
# checks out the suite branch that adds them and runs the V4.Plugins tests in
# PactNet.Compatibility.Tests against it. It runs on PRs to any base, unlike ci.yml.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      suite-repository:
        description: pact-compatibility-suite repository with features/V4/plugins
        default: YOU54F/pact-compatibility-suite
      suite-ref:
        description: Ref of that repository to run
        default: feat/plugin-features

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACT_DO_NOT_TRACK: 'true'
  SUITE_REPOSITORY: ${{ inputs.suite-repository || 'YOU54F/pact-compatibility-suite' }}
  SUITE_REF: ${{ inputs.suite-ref || 'feat/plugin-features' }}

jobs:
  plugins:
    name: V4 plugins (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout plugin suite
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SUITE_REPOSITORY }}
          ref: ${{ env.SUITE_REF }}
          path: pact-compatibility-suite-plugins

      # PactNet.Compatibility.Tests targets net10.0.
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache FFI dependencies
        id: cache
        uses: actions/cache@v6
        with:
          key: cache-ffi-${{ hashFiles('build/download-native-libs.sh') }}
          enableCrossOsArchive: true
          path: |
            build/linux
            build/macos
            build/windows

      - name: Pull interop dependencies
        run: bash -c "build/download-native-libs.sh"
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}

      - name: Install the Pact CLI
        uses: pact-foundation/pact-cli@ce8e65692ad3ea9d11244749ae24c8c49225d95f  # main

      - name: Install plugins
        run: |
          # matt is not in the plugin repository index, so it is installed from its release.
          pact plugin install https://github.com/mefellows/pact-matt-plugin/releases/tag/v0.1.1 -y
          pact plugin install csv --version 0.0.6 -y
          pact plugin install avro --version 0.1.3 -y
          pact plugin install protobuf --version 0.8.0 -y

      # PACT_COMPAT_SUITE is read at build time too, to include the plugin feature files.
      - name: Run plugin features
        run: dotnet test tests/PactNet.Compatibility.Tests --filter "FullyQualifiedName~.V4.Plugins." --verbosity normal
        env:
          PACT_COMPAT_SUITE: ${{ github.workspace }}/pact-compatibility-suite-plugins
